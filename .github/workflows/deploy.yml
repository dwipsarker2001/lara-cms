name: Laravel Deploy

on:
  push:
    branches: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Create deployment zip
        run: |
          cp .env.example .env
          php artisan key:generate
          zip -r deploy.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x "resources/js/*" \
            -x "resources/css/*" \
            -x "tests/*" \
            -x ".editorconfig" \
            -x ".gitattributes" \
            -x ".gitignore" \
            -x "composer.json" \
            -x "composer.lock" \
            -x "package.json" \
            -x "package-lock.json" \
            -x "postcss.config.js" \
            -x "tailwind.config.js" \
            -x "vite.config.js" \
            -x "phpunit.xml"

      - name: Upload zip via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          local-dir: ./
          server-dir: /etravel.eapply.site/
          exclude: |
            *

      - name: Upload deploy.zip
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl -T deploy.zip "ftp://$FTP_SERVER/etravel.eapply.site/" --user "$FTP_USERNAME:$FTP_PASSWORD" --ftp-create-dirs

      - name: SSH extract and post-deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd etravel.eapply.site
            unzip -o deploy.zip
            rm deploy.zip
            php artisan migrate --force
            php artisan storage:link
            php artisan optimize
            chmod -R 775 storage bootstrap/cache
